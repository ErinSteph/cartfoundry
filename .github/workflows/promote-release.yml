name: Publish verified desktop packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Desktop packages run to publish
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-stable-desktop
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the completed native build
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.run_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > build-run.json
          python3 - <<'PY'
          import json, os, re, subprocess
          run = json.load(open('build-run.json'))
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['event'] == 'push' and run['head_branch'].startswith('codex/release-')
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/release.yml'
          sha = run['head_sha']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          subprocess.run(['git', 'fetch', 'origin', sha, '--depth=1'], check=True)
          cmake = subprocess.check_output(['git', 'show', sha + ':CMakeLists.txt'], text=True)
          version = re.search(r'project\(CartFoundry VERSION (\d+\.\d+\.\d+)', cmake).group(1)
          subprocess.run(['git', 'diff', '--exit-code', sha, 'HEAD', '--', 'CMakeLists.txt', 'editor', 'runtime', 'images', 'examples', 'docs/versions/' + version], check=True)
          current = open('CMakeLists.txt').read()
          assert 'project(CartFoundry VERSION ' + version + ' ' in current
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('sha=' + sha + '\ntag=v' + version + '\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          path: dist/platforms
      - name: Verify all four archives and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.verified.outputs.tag }}
          VERIFIED_SHA: ${{ steps.verified.outputs.sha }}
          BUILD_RUN: ${{ inputs.run_id }}
        run: |
          python3 scripts/assemble-release.py dist/platforms dist/release --tag "$TAG"
          gh release create "$TAG" dist/release/CartFoundry-*.zip dist/release/CartFoundry-*.sha256 dist/release/stable.json --target "$VERIFIED_SHA" --title "CartFoundry $TAG" --notes "Applications for Apple Silicon, Intel Mac, Linux x86_64 and Windows x86_64. All 18 test groups and bundled compiler/editor startup checks passed on each native runner. Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN . Mac applications are ad-hoc signed; Windows applications are unsigned."
          python3 scripts/assemble-release.py dist/platforms dist/release --tag "$TAG" --verify-urls
      - name: Activate the updater feed after downloads are available
        run: |
          git pull --ff-only origin main
          cp dist/release/stable.json updates/stable.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/stable.json
          git commit -m "Publish updater feed for ${{ steps.verified.outputs.tag }}"
          git push origin main
